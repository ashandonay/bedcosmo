# Design arguments for num_visits experiment
#
# 100 designs over ugrizy, each summing to exactly 1030 visits, every band within
# 0.75-1.25x nominal. Provenance: $SCRATCH/bedcosmo/num_visits/designs/ugrizy_100/provenance.json
# Regenerate with:
#   python -m bedcosmo.num_visits.design --name ugrizy_100
labels: ["u", "g", "r", "i", "z", "y"]
input_type: variable # variable or nominal
input_path: $SCRATCH/bedcosmo/num_visits/designs/ugrizy_100

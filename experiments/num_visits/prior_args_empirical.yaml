# Empirical SED prior from DESI+EAZY (ILR parameterization).
#
# Select the template bank with the two fields below (or CLI overrides):
#   template_source: eazy12 | eazy6
#   reduced_templates: null (full bank) or "t7,t10" (comma-separated, case-insensitive)
#
# These resolve prior_dir, template_param, and the parameters: block automatically
# at submit/snapshot time (written into the run's artifacts/prior_args.yaml).
# Examples:
#   ./submit.sh train num_visits empirical
#   ./submit.sh train num_visits empirical --prior-template-source eazy6
#   ./submit.sh train num_visits empirical --prior-reduced-templates t7,t10
#   ./submit.sh train num_visits empirical --prior-density-type kde
#
# Rebuild the selected prior with:
#   python -m bedcosmo.num_visits.empirical.build_prior          # full eazy12
#   python -m bedcosmo.num_visits.empirical.build_prior \
#     --build-name empirical_prior/eazy6 \
#     --template-param templates/eazy_v1.0.spectra.param
#   python -m bedcosmo.num_visits.empirical.reduced.build_reduced_template_prior \
#     --templates T7+T10

template_source: eazy12
reduced_templates: null

# Density backend:
#   "flow" (default) -- draw the prior pool from the trained native normalizing flow and
#           use it as the prior density for entropy (native for transform_input=False;
#           gaussianized flow for transform_input=True).
#           Validated against the KDE: flow-vs-KDE A/B PASS, and H_prior=35.0 bits (24.3 nats)
#           confirmed to match in the eval pipeline.
#   "kde"  -- draw the pool from the frozen KDE plug-in instead (the pre-flow baseline; set
#           this for a KDE A/B comparison).
# The flow(s) (sed_prior_flow_native.pt / _gaussianized.pt) must exist in the resolved
# prior build dir ($SCRATCH/bedcosmo/num_visits/empirical_prior/<variant>/).
# Train them with:
#   python -m bedcosmo.num_visits.empirical.prior_flow --space both
# CLI: --prior-density-type flow|kde
density_type: flow

template_dir: null
template_norm_min: 4000.0
template_norm_max: 8000.0
# Input fitted-spectrum flux-unit conversion to erg / (s cm^2 Angstrom).
# This DESI build inherits the coadd FLUX BUNIT of 1e-17.
flux_unit_scale: 1.0e-17
prior_pool_size: 65536
prior_pool_seed: 7

# Optional plot-range overrides. When omitted (or only partially specified),
# missing f_i / log_c_scale / z entries are filled for the selected K.
parameters:
  log_c_scale:
    distribution:
      type: empirical
    plot:
      lower: 4.0
      upper: 10.5
  z:
    distribution:
      type: empirical
    plot:
      lower: 0.0
      upper: 1.75

constraints: {}

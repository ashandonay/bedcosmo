# Realistic BAO prior: a generous box around current knowledge rather than the
# full physical range. Planck 2018 gives Om = 0.315 +- 0.007, h*r_d ~ 99.1 Mpc;
# DESI DR1 BAO (LCDM) gives Om = 0.295 +- 0.015, h*r_d = 101.8 +- 1.3 Mpc.
# Om in [0.2, 0.45] and H0*r_d in [8000, 12000] km/s (h*r_d 80-120 Mpc) are
# at least ~6 sigma from both, so they hold every plausible universe without
# centring on either measurement, and sit deep inside the BAO emulators'
# training domain (Om >= ~0.057, h*r_d ~ 10-1000 Mpc).
parameters:
  # Matter density parameter
  Om:
    distribution: 
      type: "uniform"
      lower: 0.2
      upper: 0.45
    plot:
      lower: 0.2
      upper: 0.45
    latex: "\\Omega_m"
    
  # Curvature density parameter  
  Ok:
    distribution: 
      type: "uniform"
      lower: -0.3
      upper: 0.3
    plot:
      lower: -0.1
      upper: 0.3
    latex: "\\Omega_k"
    
  # Dark energy equation of state parameter
  w0:
    distribution: 
      type: "uniform"
      lower: -3.0
      upper: 1.0
    plot:
      lower: -1.3
      upper: 0.1
    latex: "w_0"
    
  # Dark energy equation of state evolution parameter
  wa:
    distribution: 
      type: "uniform"
      lower: -3.0
      upper: 2.0
    plot:
      lower: -3.0
      upper: 1.2
    latex: "w_a"
    
  # Hubble parameter times sound horizon
  hrdrag:
    distribution:
      type: "uniform"
      lower: 0.8
      upper: 1.2
    multiplier: 10000
    plot:
      lower: 8000.0
      upper: 12000.0
    latex: "H_0 r_d"

# Parameter constraints
constraints:
  # Matter + curvature constraint: total density must be positive
  valid_densities:
    affected_parameters: ["Om", "Ok"]
    bounds:
      lower: 0
      upper: 1
    
  # Dark energy equation of state constraint: must be phantom-like
  high_z_matter_dom:
    affected_parameters: ["w0", "wa"]
    bounds:
      upper: 0
    
# Emulator checkpoint paths: <analysis>: <dataset>: <cosmo_model>: <quantity>: <tracer_bin>: <path>
# Nesting mirrors the storage path $SCRATCH/bedcosmo/num_tracers/emulator/{analysis}/models/{dataset}/{cosmo_model}/
# <analysis> and <quantity> are tracer-forecast-emulator's --analysis and --quantity:
#   bao:      config | fourier (one forecast space per run, chosen by emulator_space)
#   shapefit: mean and covar (both loaded; tracer bins are tracers_for("shapefit"), LRG3 not LRG3_ELG1)
# Relative paths resolve against it; absolute paths are used verbatim; null means "no checkpoint -> fall back to the
# fixed DESI nominal covariance" (bao only; every shapefit bin needs both checkpoints).
bao:
  dr1:
    base:
      # bao has TWO forecast spaces and both have trained emulators, so this entry carries a space level (config | fourier)
      # Select with `emulator_space` in train_args.yaml or --emulator-space on the command line.
      config:
        BGS: config/v6_sigma_hrdrag_scaled/BGS.pt
        LRG1: config/v6_sigma_hrdrag_scaled/LRG1.pt
        LRG2: config/v6_sigma_hrdrag_scaled/LRG2.pt
        LRG3_ELG1: config/v6_sigma_hrdrag_scaled/LRG3_ELG1.pt
        ELG2: config/v6_sigma_hrdrag_scaled/ELG2.pt
        QSO: config/v6_sigma_hrdrag_scaled/QSO.pt
        Lya_QSO: null
      fourier:
        BGS: fourier/v3_sigma_hrdrag_scaled/BGS.pt
        LRG1: fourier/v3_sigma_hrdrag_scaled/LRG1.pt
        LRG2: fourier/v3_sigma_hrdrag_scaled/LRG2.pt
        LRG3_ELG1: fourier/v3_sigma_hrdrag_scaled/LRG3_ELG1.pt
        ELG2: fourier/v3_sigma_hrdrag_scaled/ELG2.pt
        QSO: fourier/v3_sigma_hrdrag_scaled/QSO.pt
        Lya_QSO: null
    # The extended models reuse base's checkpoints, which take (N_tracers, Om, hrdrag). That is exact under
    # emulator_covariance 'fiducial' (or a dict that moves only Om/hrdrag): the covariance is then fixed at a
    # flat-LCDM point, as DESI fixes its BAO covariance whatever model it fits, so Ok/w0/wa never reach the
    # emulator. Under 'cosmology' they would be silently ignored, so NumTracers refuses that combination.
    # Relative paths resolve against models/dr1/<cosmo_model>/, hence ../base.
    base_omegak:
      config:
        BGS: ../base/config/v6_sigma_hrdrag_scaled/BGS.pt
        LRG1: ../base/config/v6_sigma_hrdrag_scaled/LRG1.pt
        LRG2: ../base/config/v6_sigma_hrdrag_scaled/LRG2.pt
        LRG3_ELG1: ../base/config/v6_sigma_hrdrag_scaled/LRG3_ELG1.pt
        ELG2: ../base/config/v6_sigma_hrdrag_scaled/ELG2.pt
        QSO: ../base/config/v6_sigma_hrdrag_scaled/QSO.pt
        Lya_QSO: null
      fourier:
        BGS: ../base/fourier/v3_sigma_hrdrag_scaled/BGS.pt
        LRG1: ../base/fourier/v3_sigma_hrdrag_scaled/LRG1.pt
        LRG2: ../base/fourier/v3_sigma_hrdrag_scaled/LRG2.pt
        LRG3_ELG1: ../base/fourier/v3_sigma_hrdrag_scaled/LRG3_ELG1.pt
        ELG2: ../base/fourier/v3_sigma_hrdrag_scaled/ELG2.pt
        QSO: ../base/fourier/v3_sigma_hrdrag_scaled/QSO.pt
        Lya_QSO: null
    base_w:
      config:
        BGS: ../base/config/v6_sigma_hrdrag_scaled/BGS.pt
        LRG1: ../base/config/v6_sigma_hrdrag_scaled/LRG1.pt
        LRG2: ../base/config/v6_sigma_hrdrag_scaled/LRG2.pt
        LRG3_ELG1: ../base/config/v6_sigma_hrdrag_scaled/LRG3_ELG1.pt
        ELG2: ../base/config/v6_sigma_hrdrag_scaled/ELG2.pt
        QSO: ../base/config/v6_sigma_hrdrag_scaled/QSO.pt
        Lya_QSO: null
      fourier:
        BGS: ../base/fourier/v3_sigma_hrdrag_scaled/BGS.pt
        LRG1: ../base/fourier/v3_sigma_hrdrag_scaled/LRG1.pt
        LRG2: ../base/fourier/v3_sigma_hrdrag_scaled/LRG2.pt
        LRG3_ELG1: ../base/fourier/v3_sigma_hrdrag_scaled/LRG3_ELG1.pt
        ELG2: ../base/fourier/v3_sigma_hrdrag_scaled/ELG2.pt
        QSO: ../base/fourier/v3_sigma_hrdrag_scaled/QSO.pt
        Lya_QSO: null
    base_w_wa:
      config:
        BGS: ../base/config/v6_sigma_hrdrag_scaled/BGS.pt
        LRG1: ../base/config/v6_sigma_hrdrag_scaled/LRG1.pt
        LRG2: ../base/config/v6_sigma_hrdrag_scaled/LRG2.pt
        LRG3_ELG1: ../base/config/v6_sigma_hrdrag_scaled/LRG3_ELG1.pt
        ELG2: ../base/config/v6_sigma_hrdrag_scaled/ELG2.pt
        QSO: ../base/config/v6_sigma_hrdrag_scaled/QSO.pt
        Lya_QSO: null
      fourier:
        BGS: ../base/fourier/v3_sigma_hrdrag_scaled/BGS.pt
        LRG1: ../base/fourier/v3_sigma_hrdrag_scaled/LRG1.pt
        LRG2: ../base/fourier/v3_sigma_hrdrag_scaled/LRG2.pt
        LRG3_ELG1: ../base/fourier/v3_sigma_hrdrag_scaled/LRG3_ELG1.pt
        ELG2: ../base/fourier/v3_sigma_hrdrag_scaled/ELG2.pt
        QSO: ../base/fourier/v3_sigma_hrdrag_scaled/QSO.pt
        Lya_QSO: null
    base_omegak_w_wa:
      config:
        BGS: ../base/config/v6_sigma_hrdrag_scaled/BGS.pt
        LRG1: ../base/config/v6_sigma_hrdrag_scaled/LRG1.pt
        LRG2: ../base/config/v6_sigma_hrdrag_scaled/LRG2.pt
        LRG3_ELG1: ../base/config/v6_sigma_hrdrag_scaled/LRG3_ELG1.pt
        ELG2: ../base/config/v6_sigma_hrdrag_scaled/ELG2.pt
        QSO: ../base/config/v6_sigma_hrdrag_scaled/QSO.pt
        Lya_QSO: null
      fourier:
        BGS: ../base/fourier/v3_sigma_hrdrag_scaled/BGS.pt
        LRG1: ../base/fourier/v3_sigma_hrdrag_scaled/LRG1.pt
        LRG2: ../base/fourier/v3_sigma_hrdrag_scaled/LRG2.pt
        LRG3_ELG1: ../base/fourier/v3_sigma_hrdrag_scaled/LRG3_ELG1.pt
        ELG2: ../base/fourier/v3_sigma_hrdrag_scaled/ELG2.pt
        QSO: ../base/fourier/v3_sigma_hrdrag_scaled/QSO.pt
        Lya_QSO: null
shapefit:
  dr1:
    base:
      mean:
        BGS: mean/v4/BGS.pt
        LRG1: mean/v4/LRG1.pt
        LRG2: mean/v4/LRG2.pt
        LRG3: mean/v4/LRG3.pt
        ELG2: mean/v4/ELG2.pt
        QSO: mean/v4/QSO.pt
      covar:
        BGS: covar/v4/BGS.pt
        LRG1: covar/v4/LRG1.pt
        LRG2: covar/v4/LRG2.pt
        LRG3: covar/v4/LRG3.pt
        ELG2: covar/v4/ELG2.pt
        QSO: covar/v4/QSO.pt
